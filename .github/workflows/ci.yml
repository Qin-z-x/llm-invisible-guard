name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Core must be standard-library only
        run: python scripts/check_core_deps.py

      - name: Unit tests (unittest, no third-party dependencies)
        run: python -m unittest discover -s tests -t .

      - name: Install pytest (dev-only)
        run: python -m pip install --disable-pip-version-check pytest

      - name: Unit tests via pytest
        run: python -m pytest

      - name: CLI demo smoke test
        run: python -m invisi_guard demo --json > demo.json && python -c "import json; d=json.load(open('demo.json')); assert d['stripped_equals_clean'] is True; assert d['summary']['high'] >= 2"

      - name: Demo page generation is deterministic
        run: |
          python scripts/build_demo.py
          git diff --exit-code -- docs/demo.html docs/demo_revealed.html

      - name: CI gate catches invisible injection (expected exit code 1)
        run: |
          set +e
          python -m invisi_guard scan examples/poisoned_memo.txt --fail-on high
          code=$?
          set -e
          echo "scan exit code: $code"
          test "$code" -eq 1

      - name: CI gate passes clean text (expected exit code 0)
        run: python -m invisi_guard scan examples/clean_memo.txt --fail-on low
